apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "snoty.fullname" . }}-scripts
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "snoty.labels" (dict "context" $) | nindent 4 }}
data:
  extensions.json: {{ toJson .Values.download.extensions | quote }}
  download-extensions.sh: |-
    echo "Installing jq..."
    apk add --no-cache jq
    echo "Finished installing jq!"
    echo "Downloading extensions..."
    echo "Raw input: $(cat extensions.json)"
    # wget every extension
    jq -r '.[]' extensions.json | while read -r extension; do
      echo "Downloading $extension..."
      # extensions are picked up in /extensions by JIB
      if wget "$extension" -P /extensions; then
        echo "Finished downloading $extension!"
      else
        echo "Error downloading $extension!"
        if {{ .Values.download.errorOnDownloadFail }}; then
          echo "[debug] errorOnDownloadFail is set to true, exiting..."
          exit 1
        fi
      fi
    done
