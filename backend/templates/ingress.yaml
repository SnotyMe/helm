{{- if .Values.ingress.enabled }}
apiVersion: {{ .Values.ingress.apiVersion | default "networking.k8s.io/v1" }}
kind: Ingress
metadata:
  name: {{ include "snoty.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "snoty.labels" (dict "context" $) | nindent 4 }}
  {{- if .Values.ingress.annotations }}
  annotations:
    {{ include "snoty.tpl" (dict "value" .Values.ingress.annotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName | quote }}
  {{- end }}
  rules:
    {{- if .Values.ingress.hostname }}
    - host: {{ .Values.ingress.hostname }}
      http:
        paths:
          {{- if .Values.ingress.extraPaths }}
          {{ toYaml .Values.ingress.extraPaths | nindent 10 }}
          {{- end }}
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "snoty.fullname" $ }}
                port:
                  name: api
    {{- end }}
    {{- range .Values.ingress.extraHosts }}
    - host: {{ .name | quote }}
      http:
        paths:
          - path: {{ default "/" .path }}
            pathType: {{ default "ImplementationSpecific" .pathType }}
            backend:
              service:
                name: {{ include "snoty.fullname" $ }}
                {{- if kindIs "map" .servicePort }}
                port:
                  {{- include "snoty.tpl" (dict "value" .servicePort "context" $) | nindent 6 }}
                {{- else }}
                port:
                  name: {{ .servicePort | default "api" }}
                {{- end }}
    {{- end }}
    {{- if .Values.ingress.extraRules }}
    {{ include "snoty.tpl" (dict "value" .Values.ingress.extraRules "context" $) | nindent 4 }}
    {{- end }}
  {{- with .Values.ingress.tls }}
  {{- if or .enabled .extraTls }}
  tls:
    {{- if .enabled }}
    - hosts:
        - {{ $.Values.ingress.hostname }}
        {{- range $.Values.ingress.extraHosts }}
        - {{ .name }}
        {{- end }}
      secretName: {{ .secretName | default (printf "%s-tls" $.Values.ingress.hostname) }}
    {{- end }}
    {{- if .extraTls }}
    {{ include "snoty.tpl" ( dict "value" .extraTls "context" $ ) | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
