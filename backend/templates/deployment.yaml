apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snoty.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{ include "snoty.labels" (dict "context" $) | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  {{- $podLabels := .Values.podLabels }}
  selector:
    matchLabels: {{ include "snoty.labels.match" (dict "customLabels" $podLabels "context" $) | nindent 6 }}
  template:
    metadata:
      labels: {{ include "snoty.labels" (dict "customLabels" $podLabels "context" $) | nindent 8 }}
      annotations:
        snoty.me/checksum-config: {{ include "snoty.config" . | sha256sum }}
        snoty.me/checksum-scripts: {{ include (print $.Template.BasePath "/scripts-configmap.yaml") . | sha256sum }}
        {{- if .Values.podAnnotations }}
        {{ include "snoty.tpl" (dict "value" .Values.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
    spec:
      initContainers:
      {{- if .Values.download.extensions }}
      - name: download-extensions
        image: alpine:3.21
        volumeMounts:
          - name: scripts
            mountPath: /scripts
          - name: extensions
            mountPath: /extensions
        command:
        - sh
        - -c
        - "cd /scripts && ./download-extensions.sh"
      {{- end }}
      containers:
      - name: {{ include "snoty.fullname" . }}
        image: {{ include "snoty.image" . }}
        ports:
          {{ if .Values.appConfig.jvmDebug.enabled -}}
          - name: jdwp
            containerPort: 8000
          {{ end -}}
          - name: api
            containerPort: {{ .Values.containerPorts.api }}
          - name: monitoring
            containerPort: {{ .Values.containerPorts.monitoring }}
          - name: jobrunr
            containerPort: {{ .Values.containerPorts.jobrunr }}
          {{- if .Values.extraContainerPorts }}
          {{ include "snoty.tpl" (dict "value" .Values.extraContainerPorts "context" $) | nindent 12 }}
          {{- end }}
        env:
          {{- $envLoaders := include "snoty.envLoaders" . -}}
          {{ if $envLoaders -}}
          {{ $envLoaders | indent 10 }}
          {{- end -}}
          {{- if .Values.extraEnvVars -}}
          {{ include "snoty.tpl" (dict "value" .Values.extraEnvVars "context" $) | nindent 10 }}
          {{- end }}
        envFrom:
          {{- .Values.extraEnvFrom | toYaml | nindent 10 }}
        volumeMounts:
          - mountPath: /app/application.yml
            name: app-config
            subPath: application.yml
          - name: extensions
            mountPath: /extensions
        {{- if .Values.customStartupProbe }}
        startupProbe: {{ include "snoty.tpl" (dict "value" .Values.customStartupProbe "context" $) | nindent 12 }}
        {{- else if .Values.startupProbe.enabled }}
        startupProbe:
          httpGet:
            path: {{ .Values.startupProbe.path }}
            port: monitoring
          initialDelaySeconds: {{ .Values.startupProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          successThreshold: {{ .Values.startupProbe.successThreshold }}
          failureThreshold: {{ .Values.startupProbe.failureThreshold }}
        {{- end }}
        {{- if .Values.customLivenessProbe }}
        livenessProbe: {{ include "snoty.tpl" (dict "value" .Values.customLivenessProbe "context" $) | nindent 12 }}
        {{- else if .Values.livenessProbe.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.livenessProbe.path }}
            port: monitoring
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.livenessProbe.successThreshold }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        {{- end }}
        {{- if .Values.customReadinessProbe }}
        readinessProbe: {{ include "snoty.tpl" (dict "value" .Values.customReadinessProbe "context" $) | nindent 12 }}
        {{- else if .Values.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.path }}
            port: monitoring
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.readinessProbe.successThreshold }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
        {{- end }}
      volumes:
        - name: app-config
          configMap:
            name: {{ include "snoty.fullname" . }}
        - name: scripts
          configMap:
            name: {{ printf "%s-scripts" (include "snoty.fullname" .) }}
            defaultMode: 0755
        - name: extensions
          emptyDir: {}
